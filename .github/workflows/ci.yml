name: CI

# Seasonals monorepo CI — push/PR ごとに全 workspace の jest と tsc を回す共有ゲート。
# - test: ブロッキング gate (全 workspace の jest が green 必須)
# - typecheck: ブロッキング gate。mobile の pre-existing エラー (mwa.test.ts の mock 型、
#   theme.ts の THEME_CATALOG[0]) を解消して baseline=0 になったため continue-on-error を外した。
#   以前は report-only で、mobile が先に落ちると `pnpm -r` が止まり後続 workspace
#   (BFF 等) の typecheck が CI で実行されていなかった。
# - actions は tag ではなく commit SHA に固定する (tag は後から付け替えられるため、security audit 2026-10-14)。
#   行末の `# vX.Y.Z` は Dependabot が更新提案に使うので消さない・書式を変えない。
#   pin の更新は .github/dependabot.yml (github-actions のみ、monthly) が PR で出す。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm の version は root package.json の `packageManager` から読む (ここでは指定しない)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test (all workspaces — blocking gate)
        run: pnpm -r test

      - name: Typecheck (all workspaces — blocking gate)
        run: pnpm -r typecheck
